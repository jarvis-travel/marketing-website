# PR quality gate — runs on every non-main branch push so non-compliant copy is
# caught at review time, not at deploy (PR #21 review, M1). Main pushes are
# covered by node.js.yml + deploy-droplet.yml (both re-run the guards,
# including the pricing drift gate, as the final gate). The daily schedule
# catches Stripe-side drift that makes no PR and no deploy (review
# deleg_dd2f886e Design-F4b).
name: PR checks

on:
  push:
    # JAR-749: push-triggered, branches-ignore main. Two reasons:
    # 1. SECURITY (real): this repo is PUBLIC — a pull_request trigger would
    #    execute a fork's edited workflow file from the merge ref on the
    #    credential-bearing self-hosted runner. Push-only is the structural
    #    exclusion: fork PRs never execute anything.
    # 2. No ruleset requires this check (marketing has no required status
    #    checks — org 'Protections for MAIN' has none). The check is
    #    prophylaxis; main pushes are already guarded by the deploy workflows,
    #    so branches-ignore avoids doubling the guard on the 2-runner fleet.
    branches-ignore: ['main']
  schedule:
    # Daily drift sweep: a Stripe dashboard price edit makes no PR, so without
    # this, drift sits undiscovered until the next deploy.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: spare  # JAR-749: self-hosted runner (billing-limited hosted CI)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm i

      - name: Dependency audit gate (blocking, with expiring exceptions)
        # marketing-website had no audit step at all (JAR-1734). Now blocking, on
        # core's govulncheck-gate model: any high/critical advisory fails the
        # build unless it is a narrowly scoped, expiring exception in the script.
        # The gate's own self-test runs via `npm run test:scripts` below.
        run: node scripts/npm-audit-gate.mjs
      # Two halves: the literal scan always runs; the Stripe reconciliation
      # needs STRIPE_READ_API_KEY (restricted, read-only).
      # The guard's promise is "fail when the site and Stripe drift". It can only
      # keep that promise if the secret exists, so its absence is a failure here
      # rather than a skip — this step passed vacuously on every PR while the
      # secret was unconfigured, and the log said SKIPPED where nobody read it.
      - name: Assert the pricing secret is configured
        run: |
          if [ -z "$STRIPE_READ_API_KEY" ]; then
            echo "::error::STRIPE_READ_API_KEY repo secret is not configured. The pricing guard"
            echo "::error::cannot reconcile against Stripe without it, and a green check here"
            echo "::error::would mean nothing."
            echo "::error::"
            echo "::error::Add a restricted, read-only, TEST-mode key from acct_1ToBJsPDaNqc0Lek."
            echo "::error::"
            echo "::error::Do NOT copy the value out of the old STRIPE_API_KEY secret: that key is"
            echo "::error::EXPIRED (Stripe returned 'Expired API Key provided' on 2026-09-01), so"
            echo "::error::re-adding it under the new name turns this error into a less obvious"
            echo "::error::one further down. Mint a new key. The old secret can then be deleted."
            exit 1
          fi
        env:
          STRIPE_READ_API_KEY: ${{ secrets.STRIPE_READ_API_KEY }}
      - name: Pricing guard
        run: npm run lint:prices
        env:
          STRIPE_READ_API_KEY: ${{ secrets.STRIPE_READ_API_KEY }}
      # And the LIVE catalogue, which production charges (JAR-1739). Live and
      # test are separate catalogues, so the step above cannot see a live price
      # that drifts from the site. Its own secret, and --live refuses a test key
      # in it, so this cannot quietly check the test catalogue twice. A missing
      # secret fails here for the same reason as the test one above.
      - name: Assert the live pricing secret is configured
        run: |
          if [ -z "$STRIPE_LIVE_READ_API_KEY" ]; then
            echo "::error::STRIPE_LIVE_READ_API_KEY repo secret is not configured. Production charges"
            echo "::error::LIVE-mode prices, and without this key nothing checks them against the site."
            echo "::error::"
            echo "::error::Add a restricted, read-only, LIVE-mode key from acct_1ToBJsPDaNqc0Lek, with"
            echo "::error::Prices read only (JAR-1739)."
            exit 1
          fi
        env:
          STRIPE_LIVE_READ_API_KEY: ${{ secrets.STRIPE_LIVE_READ_API_KEY }}
      - name: Pricing guard (live catalogue)
        run: npm run lint:prices:live
        env:
          STRIPE_LIVE_READ_API_KEY: ${{ secrets.STRIPE_LIVE_READ_API_KEY }}
      - name: Plan-not-book language guard
        run: npm run lint:plan-not-book
      - name: Absolute-claim guard (FTC §5 / Lanham §43(a))
        run: npm run lint:absolute-claims
      - name: Pricing CTAs link into the app
        run: npm run lint:pricing-ctas
      - name: Lookup-key contract guard
        run: npm run lint:lookup-keys
      - name: Social meta guard
        run: npm run lint:social-meta
      - name: Fonts are self-hosted (no third-party font CDN)
        run: npm run lint:fonts
      - name: OG card is the real lockup
        # JAR-628 said marketing#32 "must be closed, not merged" because it
        # installed a card drawing a placeholder "JT" tile. It was merged, and
        # main shipped that placeholder on every link preview. A checksum is
        # blunt, but the card is a binary this repo does not generate — there is
        # nothing subtler to assert, and blunt would have caught it.
        run: npm run lint:og-card
      # JAR-1879: the emails hot-link their images from the apex, which this
      # site is about to take over. Ship without them and 88 templates lose
      # their masthead at once.
      - name: Email images this site has to serve are present
        run: npm run lint:email-assets

      - name: Brand mark is in sync, and the generator refuses hostile sources
        # Two things: the committed Logo.tsx and favicon.svg must still match
        # brand/logo/, and the generator's allowlist must still refuse a source
        # SVG carrying <script>, on*, <image>, <use> or a JSX brace — it is the
        # only gate between a mark and every visitor's DOM.
        run: |
          npm run logo:check
          npm run test:scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # AFTER the build, because it is a claim about the build OUTPUT. The
      # Unsplash key is used only by scripts/fetch-unsplash-manifest.mjs, which
      # runs with the secret and writes a manifest; nothing it produces may
      # carry the key into dist/. Run here rather than beside the other
      # guards — there is no bundle to inspect until the build has made one,
      # and the guard exits 2 rather than passing when dist/ is absent
      # (JAR-1431).
      - name: The Unsplash key is not in the shipped bundle
        run: npm run lint:unsplash-key
