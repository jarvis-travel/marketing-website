# Deploy marketing website to production Droplet
# Runs on every push to main (same trigger as node.js.yml's Pages deploy), or manually.
# Built artifact is rsynced to /var/www/jarvistravel-marketing/ on the DO Droplet.
#
# JAR-683: this workflow previously filtered on a hardcoded path list (src/**,
# index.html, vite.config.ts, package.json, package-lock.json) that drifted —
# public/**, tailwind.config.js, postcss.config.js, brand/**, scripts/** were
# missing, so commits touching only those files shipped to GitHub Pages and
# never reached the droplet (silent staleness; see JAR-683/JAR-1023). Removing
# the filter keeps the Pages and Droplet deploy paths in lockstep by construction.
#
# Reuses the same DROPLET_SSH_KEY and DROPLET_HOST secrets as core & web-app.

name: Deploy marketing site to Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: spare  # JAR-749: self-hosted runner (billing-limited hosted CI)
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # JAR-1518: refresh the photo manifest immediately before the build that
      # bakes it in. The script re-fetches the SAME curated photo ids committed
      # in photoManifest.json (curation is a human act, reviewed once) and
      # re-registers each download as Unsplash's terms require. It refuses to
      # run without the key, so a missing secret fails the deploy instead of
      # silently shipping a site with the photography removed. Never put this
      # on a schedule: the key shares core's 50/hour tier (JAR-1083), and a
      # run costs 2 requests per slot.
      - name: Fetch photo manifest
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/fetch-unsplash-manifest.mjs

      # Stripe-side drift happens after merge: a price edited in the dashboard
      # makes no PR, so a green PR check says nothing about what is about to be
      # deployed. Reconcile again here, immediately before shipping.
      - name: Pricing guard
        run: npm run lint:prices -- --network-warn
        env:
          STRIPE_READ_API_KEY: ${{ secrets.STRIPE_READ_API_KEY }}
      # JAR-1165: same gate as pr-checks, on the droplet shipping path.
      - name: Fonts are self-hosted (no third-party font CDN)
        run: npm run lint:fonts

      # VITE_APP_ORIGIN is where every Join Now sends a visitor. appLink.ts
      # defaults it to production; requireAppOrigin() in vite.config.ts refuses
      # to build anything that is not an https:// origin — so a staging value like
      # `localhost:5173` fails the build here rather than shipping a site
      # whose Join Now links go nowhere. Set explicitly so the deployed
      # value is a decision recorded in this file, not a default nobody chose
      # (marketing-website#46 review F2).
      - name: Build
        env:
          VITE_APP_ORIGIN: https://app.jarvistravel.com
        run: npm run build

      - name: Deploy via rsync over SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_HOST_KEY: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          set -euo pipefail
          # JAR-749 review deleg_689cdd26 (web-app#187 F2): the key must never
          # touch the persistent runner disk — load it into a job-scoped
          # in-memory ssh-agent instead.
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          echo "$SSH_KEY" | ssh-add - >/dev/null
          # Host-key pin (F3): the expected SHA256 fingerprint secret must
          # match ANY of the host's presented keys (a host often emits
          # ed25519 + rsa; the order is not a contract) — fail closed
          # instead of TOFU, and never swallow keyscan errors.
          HOST_KEY="$(ssh-keyscan -H "$HOST" 2>&1 || true)"
          if [ -z "$DROPLET_HOST_KEY" ] || ! printf '%s\n' "$HOST_KEY" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}' | grep -qx "$DROPLET_HOST_KEY"; then
            echo "::error::Droplet host key mismatch — refusing to deploy (expected fingerprint ${DROPLET_HOST_KEY})"
            exit 1
          fi
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" dist/ "root@$HOST:/var/www/jarvistravel-marketing/"
