# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Project Insight static marketing site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    
# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # deploys the static resources
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: spare  # JAR-749: self-hosted runner (billing-limited hosted CI)
    
    strategy:
      matrix:
        node-version: [22.x]  # JAR-755: 23.x EOL
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm i
      - name: Plan-not-book language guard
        run: npm run lint:plan-not-book
      - name: Absolute-claim guard (FTC §5 / Lanham §43(a))
        run: npm run lint:absolute-claims
      - name: Pricing CTAs link into the app
        run: npm run lint:pricing-ctas
      - name: Social meta guard
        run: npm run lint:social-meta

      # JAR-1165: this is a Pages SHIPPING path — a font regression that skips
      # the guard here ships third-party font loads to production. Same gate
      # as pr-checks, by the repo's own "guards run on shipping paths" rule
      # (mirrors the pricing guard's droplet-vs-Pages history).
      - name: Fonts are self-hosted (no third-party font CDN)
        run: npm run lint:fonts

      - name: OG card is the real lockup
        run: npm run lint:og-card
      # Pricing guard — this is the Pages shipping path, so it must carry the
      # same drift gate as the droplet deploy (review deleg_dd2f886e Sec-M1 /
      # Design-F4: previously the guard only gated deploy-droplet, so drifted
      # prices shipped unguarded to the Pages URL). --network-warn: a Stripe
      # outage must not block shipping; a verified mismatch still fails.
      - name: Assert the pricing secret is configured
        run: |
          if [ -z "$STRIPE_READ_API_KEY" ]; then
            echo "::error::STRIPE_READ_API_KEY repo secret is not configured. The pricing guard"
            echo "::error::cannot reconcile against Stripe without it, and a green check here"
            echo "::error::would mean nothing."
            echo "::error::"
            echo "::error::Add a restricted, read-only, TEST-mode key from acct_1ToBJsPDaNqc0Lek."
            echo "::error::"
            echo "::error::Do NOT copy the value out of the old STRIPE_API_KEY secret: that key is"
            echo "::error::EXPIRED (Stripe returned 'Expired API Key provided' on 2026-09-01), so"
            echo "::error::re-adding it under the new name turns this error into a less obvious"
            echo "::error::one further down. Mint a new key. The old secret can then be deleted."
            exit 1
          fi
        env:
          STRIPE_READ_API_KEY: ${{ secrets.STRIPE_READ_API_KEY }}
      - name: Pricing guard
        run: npm run lint:prices -- --network-warn
        env:
          STRIPE_READ_API_KEY: ${{ secrets.STRIPE_READ_API_KEY }}
      # JAR-1518: same photo-manifest refresh the droplet deploy runs (both are
      # shipping paths - the pricing guard needed this exact symmetry once
      # already, deleg_dd2f886e). Without it this path bakes the committed
      # manifest verbatim: URLs age while the droplet's stay refreshed, and the
      # same 2-requests-per-slot registration story forks per surface.
      - name: Fetch photo manifest
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/fetch-unsplash-manifest.mjs
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
